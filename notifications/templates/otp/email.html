<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OTP Verification</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333333; line-height: 1.6; max-width: 600px; margin: 0 auto; padding: 20px;">

    <!-- Brand Header -->
    <h3 style="color: #635bff; margin: 0 0 15px 0; font-size: 18px; letter-spacing: 0.5px;">
        Notification Engine
    </h3>
    
    <h2 style="color: #111111; font-size: 20px; margin-top: 0; margin-bottom: 10px;">Verification Code</h2>
    
    <p style="margin-bottom: 20px;">Please use the verification code below to sign in to your account. This code is valid for 10 minutes.</p>
    
    <p style="font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #000000; margin-bottom: 25px;">
        {{ otp }}
    </p>
    
    <!-- Footer Section with Hyperlinks -->
    <div style="font-size: 13px; color: #666666; border-top: 1px solid #eeeeee; padding-top: 15px;">
        <p style="margin: 0 0 10px 0;">If you did not request this code, please ignore this email.</p>
        
        <p style="margin: 0; font-size: 12px; color: #999999;">
            © 2026 @CraftyScripter. Built for learning purposes.<br>
            <a href="https://github.com/CraftyScripter" target="_blank" style="color: #635bff; text-decoration: none; font-weight: bold;">GitHub</a> |

        </p>
    </div>

</body>
</html>
